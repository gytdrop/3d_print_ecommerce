version: '3.8'

services:
  # 1. PostgreSQL Relational Database Service
  db:
    image: postgres:16-alpine
    container_name: techazsure-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techazsure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techazsure_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-techazsure_3dprint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techazsure} -d ${POSTGRES_DB:-techazsure_3dprint}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Go High-Performance REST Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techazsure-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-techazsure}:${POSTGRES_PASSWORD:-techazsure_secret_2026}@db:5432/${POSTGRES_DB:-techazsure_3dprint}?sslmode=disable
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Next.js 16 Standalone Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techazsure-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

  # 4. Nginx Reverse Proxy with Security SaaS Headers & Rate Limiting
  proxy:
    image: nginx:alpine
    container_name: techazsure-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
      - backend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
